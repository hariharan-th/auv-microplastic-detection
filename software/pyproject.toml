[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auv-microplastic-logger"
version = "0.1.0"
description = "Offline-first optical payload logger for a shallow-water microplastic AUV prototype"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "pyserial>=3.5,<4",
  "adafruit-blinka>=8.0",
  "adafruit-circuitpython-ads1x15>=3.4",
  "sparkfun-qwiic-as7265x>=2.0,<3",
  "paho-mqtt>=2.0,<3",
  "pymavlink>=2.4,<3",
]

[project.scripts]
auv-logger = "auv_logger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
